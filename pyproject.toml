[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sylo-sdk"
version = "0.1.4"
description = "Production operating layer for AI agent pipelines — checkpointing, permission enforcement, human approval gates, and audit logging."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Saket Jindal", email = "saketjndl2005@gmail.com" },
]
keywords = [
    "ai",
    "agents",
    "llm",
    "checkpointing",
    "audit",
    "production",
    "zero-trust",
    "langgraph",
    "crewai",
    "openai-agents",
    "langchain",
    "observability",
    "human-in-the-loop",
    "governance",
    "fault-tolerance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "httpx>=0.25",
    "redis>=5.0",
    "python-dotenv>=1.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "fakeredis>=2.21",
    "build",
    "twine",
]
langgraph = [
    "langgraph>=0.2",
    "langchain-core>=0.2",
]
openai-agents = [
    "openai-agents>=0.1",
    "openai>=1.0",
]
crewai = [
    "crewai>=0.80",
    "litellm>=1.0",
]

[project.scripts]
sylo = "sylo.cli:main"

[project.urls]
Homepage = "https://sylo-website-brown.vercel.app/"
Documentation = "https://sylo-website-brown.vercel.app/docs"
Repository = "https://github.com/saketjndl/Sylo"
Changelog = "https://github.com/saketjndl/Sylo/blob/main/CHANGELOG.md"
Issues = "https://github.com/saketjndl/Sylo/issues"
Discord = "https://discord.gg/hxr84ZwSyZ"

[tool.hatch.build.targets.wheel]
packages = ["sylo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
